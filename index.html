<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Catat Pengeluaran</title>
<meta name="theme-color" content="#0c0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap');
  :root { --bg:#0c0d10; --card:#16181d; --card2:#1d2026; --gold:#d6b98c; --gold2:#f1dfc0; --ink:#f4f1ea; --mut:#8a8f98; --line:#24272e; --red:#e8828a; --ok:#8fcfae; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:dark; }
  body { margin:0; font-family:'Inter',-apple-system,Roboto,sans-serif; color:var(--ink); background:radial-gradient(120% 60% at 50% -10%,#2a2418 0%,var(--bg) 55%) fixed; min-height:100vh; padding-bottom:110px; }
  .hidden { display:none !important; }
  .ms { width:24px; height:24px; display:inline-block; vertical-align:middle; }
  header { padding:calc(26px + env(safe-area-inset-top)) 22px 8px; }
  header .top { display:flex; justify-content:space-between; align-items:flex-start; }
  header h1 { font-size:13px; margin:0; font-weight:400; color:var(--mut); letter-spacing:.02em; }
  header h1 a { color:var(--gold) !important; opacity:1 !important; text-decoration:none; }
  .hero { margin-top:18px; }
  .hero .s { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.18em; }
  .hero .v { font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:44px; letter-spacing:-1px; margin:6px 0 4px; color:var(--gold2); }
  #heroC { font-size:12.5px; letter-spacing:0; text-transform:none; }
  .pill { border:1px solid var(--gold); color:var(--gold); padding:4px 10px; border-radius:20px; font-size:11px; }
  .tabs { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:4px; padding:6px; background:rgba(29,32,38,.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.07); border-radius:999px; box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:8; }
  .tabs button { background:none; border:0; color:var(--mut); padding:12px 26px; font-size:13.5px; font-weight:500; border-radius:999px; font-family:inherit; letter-spacing:.02em; }
  .tabs button.on { background:linear-gradient(135deg,#e8cf9f,#b8955e); color:#1a160f; font-weight:600; }
  main { padding:8px 18px 16px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:20px; margin-bottom:14px; }
  label.l { display:block; font-size:10.5px; color:var(--mut); margin:0 0 14px; text-transform:uppercase; letter-spacing:.18em; font-weight:500; }
  .amount { display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .amount span { font-size:18px; color:var(--gold); font-weight:400; }
  .amount input { border:0; outline:0; font-size:46px; font-weight:300; width:100%; color:var(--ink); background:none; font-family:'Fraunces',Georgia,serif; letter-spacing:-1px; }
  .amount input::placeholder { color:#3a3d44; }
  .quick { display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none; }
  .quick::-webkit-scrollbar { display:none; }
  .quick button { border:1px solid var(--line); background:var(--card2); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:500; white-space:nowrap; font-family:inherit; }
  .quick button[data-add=clear] { color:var(--red); }
  .chips { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .chips button { border:1px solid var(--line); background:var(--card2); border-radius:18px; padding:14px 4px 10px; font-size:10.5px; font-weight:500; color:#c9ccd2; font-family:inherit; line-height:1.25; transition:all .15s; }
  .chips button .e { display:block; margin:0 auto 7px; color:var(--gold); }
  .chips button .e .ms { width:26px; height:26px; }
  .chips button:active { transform:scale(.96); }
  .chips button.on { background:linear-gradient(160deg,#2d2619,#1d2026); border-color:var(--gold); color:var(--gold2); }
  input.f { width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:16px; font-size:16px; background:var(--card2); color:var(--ink); font-family:inherit; outline:0; }
  input.f:focus { border-color:var(--gold); }
  .btn { width:100%; padding:17px; border:0; border-radius:999px; background:linear-gradient(135deg,#ecd3a3,#b8955e); color:#1a160f; font-size:15px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-family:inherit; box-shadow:0 10px 30px rgba(214,185,140,.18); }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.6; }
  .mnav { display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px; }
  .mnav button { border:1px solid var(--line); background:var(--card); width:42px; height:42px; border-radius:50%; font-size:18px; color:var(--gold); }
  .mnav b { font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:20px; }
  .big { font-family:'Fraunces',Georgia,serif; font-size:26px; font-weight:300; margin:4px 0 8px; white-space:nowrap; color:var(--gold2); }
  .cmp { font-size:12.5px; font-weight:500; }
  .up { color:var(--red); } .down { color:var(--ok); }
  .mut { color:var(--mut); font-size:12px; }
  .tot { display:flex; gap:18px; align-items:center; }
  .donut { width:112px; height:112px; border-radius:50%; flex:none; position:relative; }
  .donut::after { content:''; position:absolute; inset:9px; background:var(--card); border-radius:50%; }
  .bar { height:4px; background:#262930; border-radius:4px; overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; border-radius:4px; }
  .ci { padding:13px 0; border-bottom:1px solid var(--line); }
  .ci:last-child { border-bottom:0; }
  .ci .h { display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:500; }
  .ci .h b { font-weight:500; }
  .ic { display:inline-flex; width:36px; height:36px; border-radius:12px; align-items:center; justify-content:center; margin-right:12px; vertical-align:middle; flex:none; }
  .ic .ms { width:19px; height:19px; }
  .hist { display:flex; align-items:flex-end; gap:10px; height:120px; margin-top:8px; }
  .hist div { flex:1; text-align:center; font-size:10px; color:var(--mut); display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .hist div i { display:block; background:#2b2e35; border-radius:6px; margin:4px 0 6px; min-height:3px; }
  .hist div.cur { color:var(--gold); }
  .hist div.cur i { background:linear-gradient(180deg,#ecd3a3,#8f7348); }
  .tx { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); gap:8px; }
  .tx:last-child { border-bottom:0; }
  .tx .a { font-weight:500; white-space:nowrap; font-size:14px; }
  .tx .del { border:0; background:none; color:#4a4e57; font-size:15px; padding:4px 6px; }
  .login { max-width:400px; margin:0 auto; padding:18px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  .login h2 { font-family:'Fraunces',Georgia,serif; font-weight:300; font-size:28px; }
  .logo { width:60px; height:60px; border-radius:20px; border:1px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  #toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px); background:var(--gold2); color:#1a160f; padding:12px 20px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; pointer-events:none; z-index:9; max-width:90%; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%); }
  .loading { text-align:center; color:var(--mut); padding:30px; }
</style>
</head>
<body>

<!-- LOGIN (sekali saja per HP) -->
<div id="login" class="login hidden">
  <div class="card">
    <div class="logo"><svg class="ms" style="width:30px;height:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6M16.5 14h.01"/></svg></div>
    <h2 style="margin:0 0 4px">Catat Pengeluaran</h2>
    <p class="mut">Isi sekali saja di HP ini.</p>
    <label class="l">Nama pencatat</label>
    <input id="lgName" class="f" placeholder="mis. Agung / Bunda" style="margin-bottom:12px">
    <label class="l">PIN keluarga</label>
    <input id="lgPin" class="f" type="password" inputmode="numeric" placeholder="PIN" style="margin-bottom:16px">
    <button class="btn" id="lgBtn">Masuk</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="top">
      <div><h1>Selamat datang, <span id="who" style="color:var(--ink)"></span> · <a href="#" id="logout" style="color:#fff;opacity:.8">ganti</a></h1>
        <div class="hero"><div class="s" id="heroL">Pengeluaran bulan ini</div><div class="v" id="heroV">Rp …</div><div class="s" id="heroC"></div></div></div>
      <span class="pill" id="pending" style="display:none"></span>
    </div>
    <div class="tabs">
      <button class="on" data-tab="catat">Catat</button>
      <button data-tab="rekap">Rekap</button>
    </div>
  </header>

  <main>
    <section id="tab-catat">
      <div class="card">
        <label class="l">Nominal</label>
        <div class="amount"><span>Rp</span><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0"></div>
        <div class="quick">
          <button data-add="000">000</button>
          <button data-add="+5000">+5rb</button>
          <button data-add="+10000">+10rb</button>
          <button data-add="+20000">+20rb</button>
          <button data-add="+50000">+50rb</button>
          <button data-add="clear">hapus</button>
        </div>
      </div>
      <div class="card">
        <label class="l">Kategori</label>
        <div id="cats" class="chips"><span class="mut" style="grid-column:1/-1">Memuat…</span></div>
      </div>
      <div class="card">
        <label class="l">Catatan</label>
        <input id="note" class="f" placeholder="mis. bakso, bensin motor" style="margin-bottom:12px">
        <label class="l">Tanggal</label>
        <input id="date" class="f" type="date">
      </div>
      <button class="btn" id="save">Simpan</button>
      <p class="mut" style="text-align:center" id="lastSaved"></p>
    </section>

    <section id="tab-rekap" class="hidden">
      <div class="mnav">
        <button id="prevM">‹</button><b id="mLabel"></b><button id="nextM">›</button>
      </div>
      <div id="rekap"><div class="loading">Memuat…</div></div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var S = { name: '', pin: '', cats: [], cat: null, ym: null, sum: null, busy: false };

var PAL = ['#d6b98c','#8fb8a8','#8ea3c9','#c98e7e','#b49ac4','#a9b878','#d1a06a','#7fb3c4','#c7a3a8','#9aa0aa','#c2b280','#7d9c8c'];
var ICON = [[/makan|jajan|kuliner/i,'restaurant'],[/dapur|sayur|pasar|grocer/i,'shopping_basket'],[/transport|bensin|ojek|parkir|tol/i,'local_gas_station'],[/anak|sekolah|pendidikan/i,'school'],[/tagihan|listrik|air|pln/i,'bolt'],[/pulsa|internet|wifi|kuota/i,'wifi'],[/sehat|obat|dokter/i,'medical_services'],[/rumah/i,'home'],[/pakaian|baju/i,'apparel'],[/hibur|liburan|nonton/i,'movie'],[/sedekah|sosial|zakat|infaq/i,'volunteer_activism'],[/cicil|kredit|hutang/i,'credit_card'],[/tabung|invest/i,'savings']];
var SVGP = {"restaurant": "M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6s1.5 4 3.5 4", "shopping_basket": "M3 4h2l2.4 11h10.2L20 8H6.2M9 19.5a1 1 0 1 0 0 .01M17 19.5a1 1 0 1 0 0 .01", "local_gas_station": "M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 9h2a1 1 0 0 1 1 1v6a1.5 1.5 0 0 0 3 0V8l-3-3", "school": "M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v5", "bolt": "M13 2L4 14h7l-1 8 9-12h-7z", "wifi": "M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01", "medical_services": "M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM12 8v8M8 12h8", "home": "M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6", "apparel": "M8 3L3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z", "movie": "M3 5h18v14H3zM3 9h18M7 5l2 4M12 5l2 4M17 5l2 4", "volunteer_activism": "M12 20s-7-4.3-8.5-8.6A4.5 4.5 0 0 1 12 7.5a4.5 4.5 0 0 1 8.5 3.9C19 15.7 12 20 12 20z", "credit_card": "M3 6h18v12H3zM3 10h18M7 15h4", "savings": "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 6.5v11M14.5 9.3c-.4-.8-1.3-1.3-2.5-1.3-1.5 0-2.5.7-2.5 1.8 0 2.4 5 1.2 5 3.7 0 1.1-1 1.8-2.5 1.8-1.2 0-2.2-.5-2.6-1.4", "receipt_long": "M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3", "account_balance_wallet": "M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6M16.5 14h.01"};
function svg(n) { return '<svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="' + SVGP[n] + '"/></svg>'; }
function icon(c) { var n = 'receipt_long'; for (var i = 0; i < ICON.length; i++) if (ICON[i][0].test(c)) { n = ICON[i][1]; break; } return svg(n); }
function color(c) { var i = S.cats.indexOf(c); if (i < 0) { i = 0; for (var k = 0; k < c.length; k++) i += c.charCodeAt(k); } return PAL[i % PAL.length]; }
function $(id) { return document.getElementById(id); }
function rp(n) { return 'Rp ' + Math.round(n || 0).toLocaleString('id-ID'); }
function digits(s) { return String(s || '').replace(/\D/g, ''); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ymLabel(ym) { var p = ym.split('-'); return BULAN[+p[1] - 1] + ' ' + p[0]; }
function ymShort(ym) { var p = ym.split('-'); return BULAN[+p[1] - 1].slice(0, 3); }
function shiftYm(ym, d) { var p = ym.split('-').map(Number), y = p[0], m = p[1] + d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + (m < 10 ? '0' : '') + m; }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function queue(q) { if (q === undefined) { try { return JSON.parse(store('cp_queue') || '[]'); } catch (e) { return []; } } store('cp_queue', JSON.stringify(q)); showPending(); }
function showPending() { var n = queue().length, p = $('pending'); p.textContent = '⏳ ' + n + ' antre'; p.style.display = n ? '' : 'none'; }

function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200); }

var API = 'https://script.google.com/macros/s/AKfycbx6CLoumFSLmpcoO93BsfZreThHviSIlH_ovPxCEcs8_-niJ8V40_38KEAqiOpENYbP/exec';
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('Gagal terhubung'); return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan'); return j.data; });
}
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

/* ---------- Login ---------- */
function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lgName').value = store('cp_name') || ''; }
$('lgBtn').onclick = function () {
  var n = $('lgName').value.trim(), p = $('lgPin').value.trim();
  if (!n || !p) return toast('Isi nama dan PIN');
  $('lgBtn').disabled = true; $('lgBtn').textContent = 'Memeriksa…';
  call('init', p).then(function (r) {
    S.name = n; S.pin = p; store('cp_name', n); store('cp_pin', p);
    start(r);
  }).catch(function (e) { toast(e.message || 'Gagal masuk'); })
    .then(function () { $('lgBtn').disabled = false; $('lgBtn').textContent = 'Masuk'; });
};
$('logout').onclick = function (e) { e.preventDefault(); store('cp_pin', null); showLogin(); };

function start(r) {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = S.name;
  S.cats = r.cats; renderCats();
  S.sum = r.summary; S.ym = r.summary.ym; renderRekap();
  showPending(); flush();
}

/* ---------- Catat ---------- */
function renderCats() {
  $('cats').innerHTML = S.cats.map(function (c) {
    return '<button class="' + (c === S.cat ? 'on' : '') + '" data-c="' + esc(c) + '"><span class="e">' + icon(c) + '</span>' + esc(c) + '</button>';
  }).join('');
}
$('cats').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  S.cat = b.getAttribute('data-c'); renderCats();
};
function setAmt(n) { $('amt').value = n ? Number(n).toLocaleString('id-ID') : ''; }
$('amt').addEventListener('input', function () { setAmt(digits(this.value)); });
document.querySelector('.quick').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var a = b.getAttribute('data-add'), cur = Number(digits($('amt').value)) || 0;
  if (a === 'clear') setAmt('');
  else if (a === '000') setAmt(cur ? cur * 1000 : '');
  else setAmt(cur + Number(a));
};

$('save').onclick = function () {
  var amount = Number(digits($('amt').value));
  if (!amount) return toast('Nominal belum diisi');
  if (!S.cat) return toast('Pilih kategori dulu');
  var d = { id: uid(), amount: amount, cat: S.cat, note: $('note').value.trim(), date: $('date').value || today(), who: S.name };
  var q = queue(); q.push(d); queue(q);
  $('lastSaved').textContent = 'Tersimpan: ' + rp(amount) + ' · ' + d.cat + (d.note ? ' (' + d.note + ')' : '');
  setAmt(''); $('note').value = ''; S.cat = null; renderCats(); $('date').value = today();
  toast('Tersimpan ✓');
  flush();
};

function flush() {
  if (S.busy) return;
  var q = queue(); if (!q.length) return;
  S.busy = true;
  var d = q[0];
  call('addTx', S.pin, d, S.ym).then(function (sum) {
    var q2 = queue().filter(function (x) { return x.id !== d.id; }); queue(q2);
    S.sum = sum; renderRekap();
    S.busy = false;
    if (q2.length) flush();
  }).catch(function (e) {
    S.busy = false;
    var msg = (e && e.message) || '';
    if (/PIN/.test(msg)) { toast('PIN salah, masuk ulang'); showLogin(); }
    else toast('Sinyal lemah — akan dikirim ulang otomatis');
  });
}
setInterval(flush, 20000);
window.addEventListener('online', flush);

/* ---------- Rekap ---------- */
function loadMonth(ym) {
  S.ym = ym; $('mLabel').textContent = ymLabel(ym);
  $('rekap').innerHTML = '<div class="loading">Memuat…</div>';
  call('getSummary', S.pin, ym).then(function (s) { S.sum = s; renderRekap(); })
    .catch(function (e) { $('rekap').innerHTML = '<div class="loading">Gagal memuat. ' + esc(e.message || '') + '</div>'; });
}
$('prevM').onclick = function () { loadMonth(shiftYm(S.ym, -1)); };
$('nextM').onclick = function () { loadMonth(shiftYm(S.ym, 1)); };

function cmpText(now, prev, label) {
  if (!prev) return '<span class="mut">Belum ada data ' + label + '</span>';
  var diff = now - prev, pct = Math.round(diff / prev * 100);
  var cls = diff > 0 ? 'up' : 'down', arrow = diff > 0 ? '▲' : '▼';
  return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(pct) + '% (' + rp(Math.abs(diff)) + ')</span> <span class="mut">vs ' + label + '</span>';
}

function renderRekap() {
  var s = S.sum; if (!s) return;
  $('mLabel').textContent = ymLabel(s.ym);
  var prevLbl = BULAN[+s.prevYm.split('-')[1] - 1];
  $('heroL').textContent = 'Pengeluaran ' + ymLabel(s.ym);
  $('heroV').textContent = rp(s.total);
  $('heroC').textContent = s.prevTotal ? ((s.total > s.prevTotal ? '▲ ' : '▼ ') + Math.abs(Math.round((s.total - s.prevTotal) / s.prevTotal * 100)) + '% vs ' + prevLbl) : '';
  var h = '', acc = 0, stops = [];
  s.byCat.forEach(function (c) { if (!c.total) return; var a = acc / s.total * 100; acc += c.total; stops.push(color(c.cat) + ' ' + a + '% ' + (acc / s.total * 100) + '%'); });
  var donut = stops.length ? 'conic-gradient(' + stops.join(',') + ')' : '#262930';

  h += '<div class="card tot"><div class="donut" style="background:' + donut + '"></div><div><div class="mut">Total pengeluaran</div><div class="big">' + rp(s.total) + '</div>';
  h += '<div class="cmp">' + cmpText(s.total, s.prevTotal, prevLbl) + '</div>';
  h += '<div class="mut" style="margin-top:8px">≈ ' + rp(s.perDay) + ' / hari';
  if (s.projection) h += '<br>Perkiraan akhir bulan ' + rp(s.projection);
  h += '</div></div></div>';

  var maxH = Math.max.apply(null, s.history.map(function (x) { return x.total; }).concat([1]));
  h += '<div class="card"><label class="l">6 bulan terakhir</label><div class="hist">';
  s.history.forEach(function (x) {
    h += '<div class="' + (x.ym === s.ym ? 'cur' : '') + '"><span>' + (x.total ? Math.round(x.total / 1000).toLocaleString('id-ID') + 'rb' : '') + '</span><i style="height:' + Math.round(x.total / maxH * 80) + '%"></i>' + ymShort(x.ym) + '</div>';
  });
  h += '</div></div>';

  h += '<div class="card"><label class="l">Per kategori</label>';
  if (!s.byCat.length) h += '<div class="mut">Belum ada pengeluaran.</div>';
  var maxC = Math.max.apply(null, s.byCat.map(function (c) { return c.total; }).concat([1]));
  s.byCat.forEach(function (c) {
    var pct = s.total ? Math.round(c.total / s.total * 100) : 0;
    var note = '';
    if (c.prev) {
      var diff = c.total - c.prev;
      if (diff) note = '<span class="' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '▲ ' : '▼ ') + rp(Math.abs(diff)) + '</span>';
    } else if (c.total) note = '<span class="mut">baru</span>';
    var col = color(c.cat);
    h += '<div class="ci"><div class="h"><span><span class="ic" style="background:' + col + '22">' + icon(c.cat) + '</span>' + esc(c.cat) + ' <span class="mut">' + pct + '%</span></span><b>' + rp(c.total) + '</b></div>';
    h += '<div class="bar"><i style="width:' + Math.round(c.total / maxC * 100) + '%;background:' + col + '"></i></div>';
    h += '<div class="mut" style="margin-top:3px">' + prevLbl + ': ' + rp(c.prev) + ' ' + note + '</div></div>';
  });
  h += '</div>';

  if (s.byWho.length) {
    h += '<div class="card"><label class="l">Per orang</label>';
    s.byWho.forEach(function (w) { h += '<div class="ci"><div class="h"><span>' + esc(w.who) + '</span><b>' + rp(w.total) + '</b></div></div>'; });
    h += '</div>';
  }

  h += '<div class="card"><label class="l">Transaksi (' + s.tx.length + ')</label>';
  if (!s.tx.length) h += '<div class="mut">Belum ada transaksi.</div>';
  s.tx.forEach(function (t) {
    var dd = t.date.split('-');
    h += '<div class="tx"><div style="display:flex;align-items:center"><span class="ic" style="background:' + color(t.cat) + '22">' + icon(t.cat) + '</span><div><div style="font-weight:600;font-size:14px">' + esc(t.note || t.cat) + '</div><div class="mut">' + (+dd[2]) + ' ' + ymShort(s.ym) + ' · ' + esc(t.cat) + ' · ' + esc(t.who) + '</div></div></div>';
    h += '<div style="display:flex;align-items:center"><span class="a">' + rp(t.amount) + '</span><button class="del" data-id="' + esc(t.id) + '">✕</button></div></div>';
  });
  h += '</div>';

  $('rekap').innerHTML = h;
}

$('rekap').onclick = function (e) {
  var b = e.target.closest('.del'); if (!b) return;
  if (!confirm('Hapus transaksi ini?')) return;
  b.disabled = true;
  call('deleteTx', S.pin, b.getAttribute('data-id'), S.ym).then(function (s) { S.sum = s; renderRekap(); toast('Dihapus'); })
    .catch(function (e) { toast(e.message || 'Gagal menghapus'); b.disabled = false; });
};

/* ---------- Tabs ---------- */
document.querySelector('.tabs').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
  var t = b.getAttribute('data-tab');
  $('tab-catat').classList.toggle('hidden', t !== 'catat');
  $('tab-rekap').classList.toggle('hidden', t !== 'rekap');
  if (t === 'rekap' && S.ym) loadMonth(S.ym);
};

/* ---------- Mulai ---------- */
$('date').value = today();
S.name = store('cp_name') || ''; S.pin = store('cp_pin') || '';
if (S.name && S.pin) {
  $('app').classList.remove('hidden'); $('who').textContent = S.name;
  call('init', S.pin).then(start).catch(function () { showLogin(); });
} else showLogin();
</script>
</body>
</html>
